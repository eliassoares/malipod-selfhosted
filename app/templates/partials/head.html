<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{ page_title }} | {{ app_name }}</title>
<style>
  :root {
    --bg: #fdf6f4;
    --surface: #ffffff;
    --surface-soft: #f7ece9;
    --surface-strong: #ead8d2;
    --text: #2d2223;
    --muted: #705c5f;
    --accent: #c2185b;
    --accent-strong: #8f1242;
    --accent-soft: #ffe0eb;
    --border: rgba(45, 34, 35, 0.12);
    --danger: #b42318;
    --success: #137333;
    --shadow: 0 24px 50px rgba(72, 32, 43, 0.12);
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Inter", "Segoe UI", sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at top left, rgba(255, 201, 218, 0.55), transparent 30%),
      radial-gradient(circle at bottom right, rgba(234, 216, 210, 0.65), transparent 32%),
      var(--bg);
  }
  a {
    color: inherit;
  }
  .page-shell {
    max-width: 1120px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  .topbar,
  .footer {
    padding: 16px 20px;
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    backdrop-filter: blur(12px);
    background: rgba(253, 246, 244, 0.88);
    border-bottom: 1px solid var(--border);
  }
  .topbar__inner,
  .footer__inner {
    max-width: 1120px;
    margin: 0 auto;
    display: flex;
    gap: 16px;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
  }
  .brand {
    font-weight: 900;
    letter-spacing: -0.04em;
    color: var(--accent);
    text-decoration: none;
    font-size: 1.35rem;
  }
  .nav-links,
  .locale-links {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .nav-link,
  .locale-link,
  .button,
  button {
    border: 0;
    border-radius: 999px;
    text-decoration: none;
    cursor: pointer;
    transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
  }
  .nav-link,
  .locale-link {
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.95rem;
  }
  .locale-link.active {
    background: var(--accent-soft);
    color: var(--accent-strong);
    border-color: rgba(194, 24, 91, 0.28);
  }
  .hero-grid {
    display: grid;
    gap: 28px;
    align-items: center;
  }
  .hero-copy,
  .card {
    background: rgba(255, 255, 255, 0.82);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    border-radius: 28px;
  }
  .hero-copy {
    padding: 28px;
  }
  .hero-kicker {
    display: inline-flex;
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent-strong);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .hero-copy h1 {
    font-size: clamp(2.2rem, 6vw, 4.5rem);
    line-height: 0.98;
    margin: 18px 0 12px;
    letter-spacing: -0.06em;
  }
  .hero-copy p {
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.6;
    margin: 0;
  }
  .hero-points {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    margin-top: 20px;
  }
  .hero-point {
    padding: 16px;
    border-radius: 20px;
    background: var(--surface-soft);
    border: 1px solid rgba(45, 34, 35, 0.08);
  }
  .hero-point strong {
    display: block;
    margin-bottom: 6px;
  }
  .card {
    padding: 24px;
  }
  .card h2 {
    margin-top: 0;
    margin-bottom: 8px;
    font-size: 1.7rem;
  }
  .card > p {
    color: var(--muted);
    margin-top: 0;
  }
  .stack {
    display: grid;
    gap: 16px;
  }
  label {
    display: grid;
    gap: 8px;
    font-weight: 600;
    font-size: 0.95rem;
  }
  input,
  select {
    width: 100%;
    padding: 14px 16px;
    border-radius: 16px;
    border: 1px solid rgba(45, 34, 35, 0.12);
    background: var(--surface);
    font: inherit;
    color: var(--text);
  }
  input:focus,
  select:focus {
    outline: 2px solid rgba(194, 24, 91, 0.18);
    border-color: rgba(194, 24, 91, 0.28);
  }
  .button,
  button {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    padding: 14px 18px;
    font: inherit;
    font-weight: 700;
  }
  .button--primary,
  button.button--primary {
    background: linear-gradient(135deg, var(--accent) 0%, #ef4f87 100%);
    color: white;
    box-shadow: 0 16px 28px rgba(194, 24, 91, 0.2);
  }
  .button--secondary,
  button.button--secondary {
    background: var(--surface-soft);
    color: var(--text);
  }
  .feedback-list {
    margin: 0;
    padding: 14px 18px;
    border-radius: 18px;
    list-style: none;
    background: #fff1f1;
    color: var(--danger);
    border: 1px solid rgba(180, 35, 24, 0.18);
  }
  .feedback-success {
    padding: 14px 18px;
    border-radius: 18px;
    background: #ecfdf3;
    border: 1px solid rgba(19, 115, 51, 0.18);
    color: var(--success);
  }
  .split-fields {
    display: grid;
    gap: 16px;
  }
  .profile-grid {
    display: grid;
    gap: 22px;
  }
  .profile-card {
    background: rgba(255, 255, 255, 0.82);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    border-radius: 28px;
    padding: 24px;
  }
  .profile-identity {
    display: grid;
    gap: 18px;
    align-items: center;
  }
  .avatar {
    width: 104px;
    height: 104px;
    border-radius: 28px;
    overflow: hidden;
    background: var(--surface-soft);
    border: 1px solid var(--border);
    display: grid;
    place-items: center;
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--accent-strong);
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .meta-list {
    display: grid;
    gap: 12px;
  }
  .meta-row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(45, 34, 35, 0.08);
  }
  .meta-row:last-child {
    border-bottom: 0;
    padding-bottom: 0;
  }
  .meta-label {
    color: var(--muted);
  }
  .footer {
    border-top: 1px solid var(--border);
    color: var(--muted);
  }
  @media (min-width: 900px) {
    .hero-grid {
      grid-template-columns: 1.1fr 0.9fr;
    }
    .split-fields {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .profile-identity {
      grid-template-columns: auto 1fr;
    }
    .profile-grid {
      grid-template-columns: 1.1fr 0.9fr;
    }
  }
</style>
