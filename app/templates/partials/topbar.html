<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" href="/">{{ copy["brand"] }}</a>
    <nav class="nav-links" aria-label="Primary">
      <a class="nav-link" href="/">{{ copy["nav.home"] }}</a>
      {% if current_user %}
      <a class="nav-link" href="/user/profile/{{ current_user.nickname }}">{{ copy["nav.profile"] }}</a>
      <form action="/logout" method="post">
        <button class="nav-link" type="submit">{{ copy["nav.logout"] }}</button>
      </form>
      {% else %}
      <a class="nav-link" href="/register">{{ copy["nav.register"] }}</a>
      <a class="nav-link" href="/login">{{ copy["nav.login"] }}</a>
      {% endif %}
    </nav>
    <nav class="locale-links" aria-label="{{ copy['language.label'] }}">
      {% for code in supported_locales %}
      <a class="locale-link {% if locale == code %}active{% endif %}" href="{{ request.url.path }}?lang={{ code }}">{{ code }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
