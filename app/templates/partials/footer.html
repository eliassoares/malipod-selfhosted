<footer class="border-t border-outline-variant/20 bg-background/60 mt-auto">

    <span class="font-headline font-black text-primary tracking-tighter flex items-center gap-1.5">
      <span class="material-symbols-outlined" style="font-size:1.1rem; font-variation-settings: 'FILL' 1;">podcasts</span>
      {{ copy["brand"] }}
    </span>
    <span class="text-xs font-label text-on-surface-variant uppercase tracking-widest">
      {{ copy["language.label"] }}: <strong class="text-on-surface">{{ locale }}</strong>
    </span>
  </div>
</footer>
