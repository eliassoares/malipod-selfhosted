<!DOCTYPE html>
<html lang="{{ locale }}">
  <head>
    {% include "partials/head.html" %}
  </head>
  <body class="bg-background font-body text-on-surface min-h-screen" style="background: radial-gradient(circle at top left, rgba(255,201,218,0.35) 0%, transparent 28%), radial-gradient(circle at bottom right, rgba(234,216,210,0.45) 0%, transparent 30%), #fcf5f4;">
    {% include "partials/topbar.html" %}
    <main class="{% block main_class %}max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8{% if current_user is defined and current_user %} pb-28{% endif %}{% endblock %}">
      {% block content %}{% endblock %}
    </main>
    {% if current_user is defined and current_user %}
    {% include "partials/player_bar.html" %}
    <script>
      window.__PLAYER_STATE__ = {% if current_user.last_episode_id %}
        {
          episodeId: {{ current_user.last_episode_id }},
          positionSec: {% if current_user.last_position_sec is not none %}{{ current_user.last_position_sec }}{% else %}null{% endif %},
          queueMode: {% if current_user.last_queue_mode %}"{{ current_user.last_queue_mode }}"{% else %}null{% endif %},
          queueRefId: {% if current_user.last_queue_ref_id is not none %}{{ current_user.last_queue_ref_id }}{% else %}null{% endif %}
        }
      {% else %}null{% endif %};
    </script>
    <script src="/static/js/player.js" defer></script>
    {% endif %}
    {% include "partials/footer.html" %}
  </body>
</html>
