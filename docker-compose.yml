services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./archive:/app/archive
    restart: unless-stopped

  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: malipod
      POSTGRES_USER: malipod
      POSTGRES_PASSWORD: malipod
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U malipod -d malipod"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
