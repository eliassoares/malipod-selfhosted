<body class="bg-background font-body text-on-surface min-h-screen flex flex-col">
<nav class="bg-background/80 backdrop-blur-md fixed w-full top-0 z-50 border-b border-surface-container">
<div class="flex justify-between items-center px-6 py-4 max-w-7xl mx-auto">
<div class="flex items-center gap-8">
<span class="text-2xl font-black tracking-tighter text-primary font-headline">Malipod</span>
<div class="hidden md:flex gap-6">
<a class="text-on-surface hover:text-primary font-headline text-sm font-medium transition-colors" href="#">Toplist</a>
<a class="text-on-surface hover:text-primary font-headline text-sm font-medium transition-colors" href="#">Guides</a>
<a class="text-on-surface hover:text-primary font-headline text-sm font-medium transition-colors" href="#">Dashboard</a>
</div>
</div>
<div class="flex items-center gap-2">
<button class="p-2 rounded-full hover:bg-surface-container transition-colors text-on-surface">
<span class="material-symbols-outlined">language</span>
</button>
<button class="p-2 rounded-full hover:bg-surface-container transition-colors text-on-surface">
<span class="material-symbols-outlined">notifications</span>
</button>
</div>
</div>
</nav>
<main class="flex-grow flex items-center justify-center p-6 pt-24 pb-12">
<div class="w-full max-w-[440px] space-y-8">
<!-- Header Section -->
<div class="text-center space-y-3">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl gradient-primary mb-2 shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-white text-3xl">podcasts</span>
</div>
<h1 class="text-3xl font-headline font-extrabold text-on-surface tracking-tight">Bem-vindo ao Malipod</h1>
<p class="text-on-surface-variant max-w-[280px] mx-auto">Sincronize sua jornada sonora em qualquer lugar.</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-3xl p-8 ambient-shadow border border-surface-container">
<form class="space-y-5">
<!-- Identifier -->
<div class="space-y-1.5">
<label class="text-[11px] font-bold uppercase tracking-wider text-on-surface-variant ml-1" for="identifier">E-mail ou Usuário</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">alternate_email</span>
<input class="w-full pl-12 pr-4 py-3.5 bg-surface-container-low rounded-xl border-none focus:ring-2 focus:ring-primary-container focus:bg-surface-container-lowest transition-all text-on-surface placeholder:text-outline-variant" id="identifier" placeholder="ex: voce@email.com" type="text"/>
</div>
</div>
<!-- Password -->
<div class="space-y-1.5">
<div class="flex justify-between items-center px-1">
<label class="text-[11px] font-bold uppercase tracking-wider text-on-surface-variant" for="password">Senha</label>
<a class="text-[11px] font-bold text-primary hover:text-primary-dim transition-colors" href="#">Esqueceu?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-12 pr-12 py-3.5 bg-surface-container-low rounded-xl border-none focus:ring-2 focus:ring-primary-container focus:bg-surface-container-lowest transition-all text-on-surface placeholder:text-outline-variant" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<button class="w-full gradient-primary text-on-primary font-bold py-4 rounded-full shadow-lg shadow-primary/25 hover:opacity-90 active:scale-[0.98] transition-all flex justify-center items-center gap-2 mt-4" type="submit">
                        Entrar na conta
                        <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-8 flex items-center">
<div class="flex-grow border-t border-outline-variant/15"></div>
<span class="flex-shrink mx-4 text-[10px] font-bold text-outline-variant uppercase tracking-[0.2em]">ou</span>
<div class="flex-grow border-t border-outline-variant/15"></div>
</div>
<!-- Future Social Logins Placeholder -->
<div class="grid grid-cols-2 gap-3">
<button class="flex items-center justify-center gap-2 py-3 px-4 bg-surface-container-low hover:bg-surface-container transition-all rounded-xl text-sm font-semibold border border-outline-variant/10">
<img alt="Google Logo" class="w-4 h-4" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDPAk31ykjuo1p7S38uXXysb5nEZzI9z2siKVQ9uMbmNHnAsjav0mBYELFG3mDTb1fN5Gcs3Ur4hVTTHDLefD-AkdTT3pBX28bDJVNMegP5sZvWqFhtp9scmw1FNHk9nuHta863Crp-9hDUHPBtW3YVMEKCf3LoGH3sW4r6b2puhjJQq56KdL1SnI2oIEie3Em4C4f69kDuntR92nfnMMbXFmHYqKnnwd0l8_Q7kzil9hPp73ex_o06GJhve3moJv9oJx-n8dhodPKA"/>
                        Google
                    </button>
<button class="flex items-center justify-center gap-2 py-3 px-4 bg-surface-container-low hover:bg-surface-container transition-all rounded-xl text-sm font-semibold border border-outline-variant/10">
<span class="material-symbols-outlined text-lg">brand_family</span>
                        GitHub
                    </button>
</div>
</div>
<!-- Footer Link -->
<footer class="text-center">
<p class="text-sm text-on-surface-variant font-medium">
                    Novo por aqui?
                    <a class="text-primary font-bold hover:underline decoration-2 underline-offset-4 transition-all" href="#">Criar conta Malipod</a>
</p>
</footer>
</div>
</main>
</body></html>
