services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile.dev
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: malipod
      POSTGRES_USER: malipod
      POSTGRES_PASSWORD: malipod
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U malipod -d malipod"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

volumes:
  postgres_data_dev:
