[project]
name = "malipod"
version = "0.1.0"
description = "Modern implementation of the gpodder.net sync API with a web dashboard for podcast management"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.16.5",
    "asyncpg==0.30.0",
    "fastapi==0.135.3",
    "greenlet==3.2.4",
    "jinja2==3.1.6",
    "pydantic-settings==2.11.0",
    "sqlalchemy==2.0.43",
    "starlette==0.49.1",
    "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "httpx==0.28.1",
    "mypy>=1.19.1",
    "pip-audit>=2.10.0",
    "pre-commit>=4.5.1",
    "aiosqlite==0.21.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.15.7",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific rules
    "S",     # security
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
]
ignore = ["S101"]  # assert allowed in tests

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.bandit]
exclude_dirs = [".venv", "tests"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.alembic]
script_location = "alembic"
