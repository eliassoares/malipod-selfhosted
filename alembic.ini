[alembic]
script_location = alembic
prepend_sys_path = .
# Used only by `alembic` CLI when run directly (e.g. alembic upgrade head).
# The application itself overrides this at runtime via settings.effective_database_url.
# Matches the Docker Compose db service credentials in docker-compose.yml.
sqlalchemy.url = postgresql+asyncpg://malipod:malipod@db:5432/malipod

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
