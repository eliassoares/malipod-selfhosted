openapi: 3.1.0
info:
  title: Malipod Episodes API
  version: 0.1.0-episodes
  summary: Compatibility contracts for user-scoped episode action synchronization
  description: >
    Authenticated compatibility API for uploading episode actions, retrieving
    action history, filtering by podcast or device, and requesting aggregated
    latest-action results.
servers:
  - url: http://localhost:8000
    description: Local development server
tags:
  - name: Episodes
paths:
  /api/2/episodes/{username}.json:
    post:
      tags: [Episodes]
      summary: Upload episode actions for one account
      operationId: postEpisodeActions
      security:
        - basicAuth: []
      parameters:
        - $ref: "#/components/parameters/Username"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/EpisodeActionInput"
      responses:
        "200":
          description: Episode actions stored successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeActionUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      tags: [Episodes]
      summary: Retrieve episode actions for one account
      operationId: getEpisodeActions
      security:
        - basicAuth: []
      parameters:
        - $ref: "#/components/parameters/Username"
        - name: podcast
          in: query
          required: false
          schema:
            type: string
            format: uri-reference
          description: Limit results to actions for one podcast feed URL
        - name: device
          in: query
          required: false
          schema:
            type: string
            pattern: '^[\w.-]+$'
          description: Limit results to actions recorded for one device ID
        - name: since
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: Return only actions uploaded after this server-issued timestamp
        - name: aggregated
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Return only the latest matching action for each episode
      responses:
        "200":
          description: Matching episode actions returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeActionQueryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  parameters:
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request payload, invalid query parameters, or invalid episode action data
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid HTTP Basic authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated user does not match the targeted username
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
    EpisodeActionInput:
      type: object
      required: [podcast, episode, action]
      properties:
        podcast:
          type: string
          format: uri-reference
        episode:
          type: string
          format: uri-reference
        device:
          type: string
          pattern: '^[\w.-]+$'
        action:
          type: string
          enum: [download, delete, play, new, flattr]
        timestamp:
          type: string
          format: date-time
        started:
          type: integer
          minimum: 0
        position:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
    EpisodeActionOutput:
      type: object
      required: [podcast, episode, action]
      properties:
        podcast:
          type: string
          format: uri
        episode:
          type: string
          format: uri
        device:
          type: string
        action:
          type: string
          enum: [download, delete, play, new, flattr]
        timestamp:
          type: string
          format: date-time
        started:
          type: integer
          minimum: 0
        position:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
    EpisodeActionUploadResponse:
      type: object
      required: [timestamp, update_urls]
      properties:
        timestamp:
          type: integer
          minimum: 0
        update_urls:
          type: array
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: string
    EpisodeActionQueryResponse:
      type: object
      required: [actions, timestamp]
      properties:
        actions:
          type: array
          items:
            $ref: "#/components/schemas/EpisodeActionOutput"
        timestamp:
          type: integer
          minimum: 0
