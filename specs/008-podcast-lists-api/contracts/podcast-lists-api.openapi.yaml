openapi: 3.1.0
info:
  title: Malipod Podcast Lists API
  version: 0.1.0-podcast-lists
  summary: Compatibility contracts for user-owned curated podcast lists
  description: >
    Compatibility API for creating, listing, retrieving, updating, and deleting
    podcast lists. Individual list documents support JSON, OPML, and plaintext
    representations, while user list summaries are returned as JSON.
servers:
  - url: http://localhost:8000
    description: Local development server
tags:
  - name: Podcast Lists
paths:
  /api/2/lists/{username}/create.{format}:
    post:
      tags: [Podcast Lists]
      summary: Create a podcast list for one user
      operationId: createPodcastList
      security:
        - basicAuth: []
      parameters:
        - $ref: "#/components/parameters/Username"
        - $ref: "#/components/parameters/ListFormat"
        - name: title
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: URL-encoded title used to derive the canonical list name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListJsonRequest"
          application/xml:
            schema:
              type: string
              description: OPML document containing one ordered podcast outline per feed
          text/plain:
            schema:
              type: string
              description: Plaintext document with one feed URL per line
      responses:
        "303":
          description: List created successfully
          headers:
            Location:
              required: true
              schema:
                type: string
              description: Canonical URL for the created list resource
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/2/lists/{username}.json:
    get:
      tags: [Podcast Lists]
      summary: Get all podcast list summaries for one user
      operationId: getUserPodcastLists
      parameters:
        - $ref: "#/components/parameters/Username"
      responses:
        "200":
          description: List summaries returned successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PodcastListSummary"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/2/lists/{username}/list/{listname}.{format}:
    get:
      tags: [Podcast Lists]
      summary: Get one podcast list in the requested format
      operationId: getPodcastList
      parameters:
        - $ref: "#/components/parameters/Username"
        - $ref: "#/components/parameters/ListName"
        - $ref: "#/components/parameters/ListFormat"
      responses:
        "200":
          description: Podcast list returned in the requested format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListJsonResponse"
            application/xml:
              schema:
                type: string
            text/plain:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Podcast Lists]
      summary: Replace one podcast list
      operationId: updatePodcastList
      security:
        - basicAuth: []
      parameters:
        - $ref: "#/components/parameters/Username"
        - $ref: "#/components/parameters/ListName"
        - $ref: "#/components/parameters/ListFormat"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListJsonRequest"
          application/xml:
            schema:
              type: string
              description: OPML document containing one ordered podcast outline per feed
          text/plain:
            schema:
              type: string
              description: Plaintext document with one feed URL per line
      responses:
        "204":
          description: Podcast list replaced successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Podcast Lists]
      summary: Delete one podcast list
      operationId: deletePodcastList
      security:
        - basicAuth: []
      parameters:
        - $ref: "#/components/parameters/Username"
        - $ref: "#/components/parameters/ListName"
        - $ref: "#/components/parameters/ListFormat"
      responses:
        "204":
          description: Podcast list deleted successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  parameters:
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
    ListName:
      name: listname
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    ListFormat:
      name: format
      in: path
      required: true
      schema:
        type: string
        enum: [json, opml, txt]
  responses:
    BadRequest:
      description: Invalid format, title, or request payload
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid HTTP Basic authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated user does not match the targeted username
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Requested user or list does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The generated canonical name already exists for the targeted user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
    PodcastListSummary:
      type: object
      required: [title, name, web]
      properties:
        title:
          type: string
        name:
          type: string
        web:
          type: string
          format: uri
    ListJsonRequest:
      oneOf:
        - type: array
          description: Simplified JSON upload containing one feed URL per item
          items:
            type: string
            format: uri-reference
        - type: object
          required: [podcasts]
          properties:
            podcasts:
              type: array
              items:
                $ref: "#/components/schemas/ListEntry"
      description: Ordered list document accepted for create or update
    ListJsonResponse:
      type: object
      required: [title, name, podcasts]
      properties:
        title:
          type: string
        name:
          type: string
        podcasts:
          type: array
          items:
            $ref: "#/components/schemas/ListEntry"
    ListEntry:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri-reference
        title:
          type: string
        website:
          type: string
          format: uri-reference
        description:
          type: string
